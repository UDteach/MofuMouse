name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: pwsh
        run: go test ./...
      - name: Build x86/x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "386"
          go build -ldflags="-H=windowsgui -X main.appVersion=${{ github.ref_name }}" -o dist\MofuMouse.exe ./cmd/mofumouse
          Compress-Archive -Path dist\MofuMouse.exe -DestinationPath dist\MofuMouse-windows-x86.zip -Force
          Remove-Item dist\MofuMouse.exe
          $env:GOARCH = "amd64"
          go build -ldflags="-H=windowsgui -X main.appVersion=${{ github.ref_name }}" -o dist\MofuMouse.exe ./cmd/mofumouse
          Compress-Archive -Path dist\MofuMouse.exe -DestinationPath dist\MofuMouse-windows-x64.zip -Force
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MofuMouse-windows-x86.zip
            dist/MofuMouse-windows-x64.zip
