name: Preview apps and website
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact preview tag matching electron-prototype/package.json
        required: true
        default: v0.1.0-preview.3
        type: string
      windows_run:
        description: Optional prior Windows run; exact app and build inputs must match
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mofumouse-preview-release
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_run != '' && '[{"os":"macos-15","platform":"darwin"}]' || '[{"os":"windows-2022","platform":"win32"},{"os":"macos-15","platform":"darwin"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-prototype
    env:
      EXPECTED_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron-prototype/package-lock.json
      - name: Verify preview version
        run: node -e "const p=require('./package.json');if(!/^v\d+\.\d+\.\d+-preview\.\d+$/.test(process.env.EXPECTED_TAG)||process.env.EXPECTED_TAG!=='v'+p.version)throw Error('Preview version mismatch')"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac Apple Silicon and Intel DMG/ZIP
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: macOS 12 compatibility DMG/ZIP (Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: npm run dist:mac:monterey
      - name: Verify Mac architectures, minimum OS, signatures and native executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for directory in release-build release-build-macos12; do
            minimum=13.0
            runtime=44.4.5
            if [ "$directory" = release-build-macos12 ]; then minimum=12.0; runtime=43.7.5; fi
            count=0
            while IFS= read -r -d '' app; do
              expected_arch=x86_64
              case "$app" in */mac-arm64/*) expected_arch=arm64 ;; esac
              actual_arch="$(lipo -archs "$app/Contents/MacOS/MofuMouse")"
              actual_minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
              echo "Verifying $app: architecture=$actual_arch minimum=$actual_minimum"
              test "$actual_arch" = "$expected_arch"
              test "$actual_minimum" = "$minimum"
              codesign --verify --deep --strict "$app"
              count=$((count + 1))
            done < <(find "$directory" -maxdepth 2 -name '*.app' -print0)
            test "$count" -eq 2
            arch="$(node -p process.arch)"
            appdir=mac
            if [ "$arch" = arm64 ]; then appdir=mac-arm64; fi
            ELECTRON_RUN_AS_NODE=1 "$directory/$appdir/MofuMouse.app/Contents/MacOS/MofuMouse" -e "if(process.versions.electron!=='$runtime')process.exit(1)"
          done
      - name: Verify packed source, image hashes and output names
        run: node scripts/verify-release-build.mjs
      - name: Verify Monterey packed source, image hashes and output names
        if: runner.os == 'macOS'
        run: node scripts/verify-release-build.mjs --monterey
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: preview-${{ matrix.platform }}
          path: |
            electron-prototype/release-build/*.exe
            electron-prototype/release-build/*.zip
            electron-prototype/release-build/*.dmg
            electron-prototype/release-build/build-info-*.json
            electron-prototype/release-build-macos12/*.zip
            electron-prototype/release-build-macos12/*.dmg
            electron-prototype/release-build-macos12/build-info-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          merge-multiple: true
          path: release-assets
      - name: Reuse Windows only when its exact app and build inputs match
        if: inputs.windows_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN_INPUT: ${{ inputs.windows_run }}
        run: node scripts/reuse-windows-build.mjs
      - name: Collect distribution files from preserved build directories
        run: node scripts/normalize-release-assets.mjs
      - name: Prepare and verify public page
        run: |
          node scripts/build-web-demo.mjs
          node scripts/verify-public-site.mjs
          node scripts/stage-preview-site.mjs
      - name: Verify all ten downloads and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: node scripts/publish-release.mjs
      - name: Verify public release downloads and their published checksums
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: node scripts/verify-published-release.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - id: deployment
        uses: actions/deploy-pages@v4
